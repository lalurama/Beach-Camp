services:
  # ==============================================================
  # 1. Backend Application Service (PHP 8.3-FPM + Laravel)
  # ==============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: beachcamp-app:latest
    container_name: beachcamp_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    networks:
      - beachcamp_network
    depends_on:
      db:
        condition: service_healthy

  # ==============================================================
  # 2. Web Server Service (Nginx)
  # ==============================================================
  web:
    image: nginx:alpine
    container_name: beachcamp_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - beachcamp_network
    depends_on:
      - app

  # ==============================================================
  # 3. Database Service (MySQL 8.0)
  # ==============================================================
  db:
    image: mysql:8.0
    container_name: beachcamp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-beachcamp}
      MYSQL_USER: ${DB_USERNAME:-beachcamp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - beachcamp_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  dbdata:
    driver: local

networks:
  beachcamp_network:
    driver: bridge
